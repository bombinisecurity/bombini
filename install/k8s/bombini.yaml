apiVersion: v1
kind: ServiceAccount
metadata:
  name: bombini
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bombini
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bombini
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bombini
subjects:
  - kind: ServiceAccount
    name: bombini
    namespace: default
---
# Cap what the agents can take from kube-apiserver. Client side jitter and
# backoff are politeness, this is the guarantee: a fleet wide restart cannot
# starve other clients no matter how the agents behave.
apiVersion: flowcontrol.apiserver.k8s.io/v1
kind: PriorityLevelConfiguration
metadata:
  name: bombini
spec:
  type: Limited
  limited:
    nominalConcurrencyShares: 5
    limitResponse:
      type: Queue
      queuing:
        queues: 32
        handSize: 4
        queueLengthLimit: 50
---
apiVersion: flowcontrol.apiserver.k8s.io/v1
kind: FlowSchema
metadata:
  name: bombini
spec:
  priorityLevelConfiguration:
    name: bombini
  matchingPrecedence: 1000
  distinguisherMethod:
    type: ByUser
  rules:
    - subjects:
        - kind: ServiceAccount
          serviceAccount:
            name: bombini
            namespace: default
      resourceRules:
        - verbs: ["get", "list", "watch"]
          apiGroups: [""]
          resources: ["pods"]
          clusterScope: true
          namespaces: ["*"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bombini
  namespace: default
data:
  config.yaml: |
    # Global parameters for bombini agent.
    # All paths must be full canonical or
    # relative to this config file.
    ---
    # Directory with bpf detector object files
    bpf_objs: /usr/local/lib/bombini/bpf

    # Path to pin bpf maps.
    maps_pin_path: /sys/fs/bpf/bombini

    # Event map size (ring buffer size in bytes)
    event_map_size: 65536

    # Raw event channel size (number of event messages)
    event_channel_size: 64

    # Procmon process map size
    procmon_proc_map_size: 8192

    # Retain Transmuters caches every <gc_period> sec
    gc_period: 30

    # Transmit events to log file
    #log_file: /var/log/bombini/bombini.log

    # Log file size in MB
    log_file_size: 10

    # Number of log file rotations
    log_file_rotations: 5

    # Enable log file compression
    log_file_compression: false

    # Prometheus metric server port. This option enables metric server
    metric_server_port: 9100

    # Enrich events with kubernetes pod metadata.
    # Requires the agent to be built with the k8s feature
    k8s_enabled: true

    # Max delay before the initial pod list request in seconds. Spreads the
    # load on kube-apiserver when the whole fleet restarts at once
    k8s_startup_jitter_sec: 30

    # Pod labels to copy into events. All the others are dropped. Use "*" to
    # copy all labels
    #k8s_pod_labels:
    #   - app.kubernetes.io/name

    # List of the detectors to load
    detectors:
      - procmon
      #- filemon
      #- netmon
      #- kernelmon
      #- io_uringmon
      #- gtfobins
  procmon.yaml: |
    gc_period: 5
    setuid:
      enabled: false
    capset:
      enabled: false
    prctl:
      enabled: false
    create_user_ns:
      enabled: false
    ptrace_access_check:
      enabled: false
    bprm_check:
      enabled: false
    sched_process_exec:
      enabled: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bombini
  namespace: default
  labels:
    app: bombini
spec:
  selector:
    matchLabels:
      app: bombini
  template:
    metadata:
      labels:
        app: bombini
    spec:
      hostPID: true
      serviceAccountName: bombini
      containers:
        - name: bombini
          image: bombini # Change it to bombini image location
          imagePullPolicy: IfNotPresent
          env:
            - name: RUST_LOG
              value: "info"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - name: bpf-fs
              mountPath: /sys/fs/bpf
            - name: config
              mountPath: /usr/local/lib/bombini/config
              readOnly: true
      volumes:
        - name: bpf-fs
          hostPath:
            path: /sys/fs/bpf
        - name: config
          configMap:
            name: bombini
